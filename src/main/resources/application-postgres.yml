spring:
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://127.0.0.1:5432/membrane_java}
    username: ${JDBC_USER:membrane}
    password: ${JDBC_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/postgres
    placeholders:
      embeddingDimensions: ${EMBEDDING_DIMENSIONS:1024}
app:
  demo: false
  execution: rabbit
  vector-enabled: ${VECTOR_ENABLED:false}

  redis-enabled: true
  spec-cache:
    enabled: true
  object-store: minio

management:
  health:
    rabbit:
      enabled: true
    redis:
      enabled: true
